<div class="stock-search">
    STOCK SEARCH
  </div>

<div class="d-flex">

    <div class="input-group">
        <input matInput [formControl]="myControl" placeholder="Enter stock ticker symbol" aria-label="Search" [matAutocomplete]="auto"
               class="mat-input-element" (keyup.enter)="search()">
        <mat-autocomplete #auto="matAutocomplete" [panelWidth]="'auto'" (optionSelected)="onOptionSelected($event)" class="custom-autocomplete">
          <mat-option *ngFor="let option of filteredOptions | async" [value]="option" class="options">
            {{ option }}
          </mat-option>

          <mat-option *ngIf="isLoading">
            <mat-spinner style="color: blue !important;" [diameter]="20"></mat-spinner>
          </mat-option>

        </mat-autocomplete>
  
      <!-- Updated to call a search method -->
      <button (click)="search()" class="btn position-absolute search-btn" type="button">
        <i class="fas fa-search"></i>
      </button>
  
      <!-- Clear the input field -->
      <button (click)="clear()" class="btn position-absolute clear-btn" type="button">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>
